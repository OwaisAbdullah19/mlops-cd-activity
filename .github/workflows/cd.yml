  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Set lowercase repository name
        id: repo
        run: |
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: |
          docker build \
            -t ghcr.io/${{ steps.repo.outputs.repo }}:${{ steps.version.outputs.version }} \
            -t ghcr.io/${{ steps.repo.outputs.repo }}:latest \
            .
      - name: Push
        run: |
          docker push ghcr.io/${{ steps.repo.outputs.repo }}:${{ steps.version.outputs.version }}
          docker push ghcr.io/${{ steps.repo.outputs.repo }}:latest